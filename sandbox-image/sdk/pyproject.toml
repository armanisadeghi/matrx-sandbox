[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrx-sdk"
version = "0.1.2"
description = "Matrx SDK — agent utilities + Claude Code-compatible tools for Matrx sandboxes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websockets>=11.0",
    "watchdog>=3.0",
    "python-multipart>=0.0.6",
    # Supabase Realtime client — drives CloudFilesWatcher's RealtimeSubscriber
    # so the sandbox gets sub-second visibility into edits the user makes via
    # the AI Dream UI. Falls back to polling when SUPABASE_URL / KEY env are
    # absent, so it's safe on builds that don't pass them through.
    "realtime>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["matrx_agent*", "matrx_tools*"]
