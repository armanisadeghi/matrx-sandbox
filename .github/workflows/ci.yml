name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Release-hardening tests archive the exact legacy EC2 source SHAs.
          # CI must fetch them just like the release-gating Deploy workflow.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.8"
          enable-cache: true
          cache-suffix: ci
          cache-dependency-glob: |
            orchestrator/uv.lock
            sandbox-image/sdk/uv.lock
      - name: Install dependencies
        run: |
          uv sync --directory orchestrator --locked --extra dev --python 3.13
          uv sync --directory sandbox-image/sdk --locked --extra dev --python 3.11
      - name: Run orchestrator tests
        run: |
          cd orchestrator
          .venv/bin/pytest -v --tb=short
      - name: Run sandbox SDK tests
        run: sandbox-image/sdk/.venv/bin/pytest sandbox-image/sdk/tests -v --tb=short
      # Cost guard (ci-spend, 2026-10-11): .github/ci-cost.json covers every workflow and OS leg, no
      # macOS/Windows per push, every job time-limited, every dispatch names requested_by.
      - name: Workflow cost guard (proves it can fail, then checks every workflow)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_workflow_runner_cost.py --self-test && python3 scripts/check_workflow_runner_cost.py

  build-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build sandbox image
        run: docker build -t matrx-sandbox:latest sandbox-image/

  build-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build orchestrator image
        run: docker build -t matrx-orchestrator:latest orchestrator/
