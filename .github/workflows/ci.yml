name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-suffix: ci
          cache-dependency-glob: |
            orchestrator/uv.lock
            sandbox-image/sdk/pyproject.toml
      - name: Install dependencies
        run: |
          uv sync --directory orchestrator --locked --extra dev --python 3.11
          uv venv --python 3.11 sandbox-image/sdk/.venv
          uv pip install --python sandbox-image/sdk/.venv/bin/python -e "sandbox-image/sdk[dev]"
      - name: Run orchestrator tests
        run: |
          cd orchestrator
          .venv/bin/pytest -v --tb=short
      - name: Run sandbox SDK tests
        run: sandbox-image/sdk/.venv/bin/pytest sandbox-image/sdk/tests -v --tb=short

  build-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t matrx-sandbox:latest sandbox-image/

  build-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build orchestrator image
        run: docker build -t matrx-orchestrator:latest orchestrator/
