name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd orchestrator
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          cd orchestrator
          pytest -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push sandbox image
        run: |
          ECR_REPO=${{ secrets.ECR_REPO_URI }}
          docker build -t $ECR_REPO:latest -t $ECR_REPO:${{ github.sha }} sandbox-image/
          docker push $ECR_REPO:latest
          docker push $ECR_REPO:${{ github.sha }}

      - name: Build and push lightweight (slim) sandbox image
        run: |
          # The "launch from chat" coding box — git-as-persistence, no
          # S3/FUSE/Chromium. Spawned when template=slim resolves to
          # matrx-sandbox:slim. See docs/EC2_LIGHTWEIGHT_BOX.md.
          ECR_REPO=${{ secrets.ECR_REPO_URI }}
          docker build -f sandbox-image/Dockerfile.slim \
            -t $ECR_REPO:slim -t $ECR_REPO:slim-${{ github.sha }} sandbox-image/
          docker push $ECR_REPO:slim
          docker push $ECR_REPO:slim-${{ github.sha }}

      - name: Build and push orchestrator image
        run: |
          ECR_REPO=${{ secrets.ECR_REPO_URI }}-orchestrator
          docker build -t $ECR_REPO:latest -t $ECR_REPO:${{ github.sha }} orchestrator/
          docker push $ECR_REPO:latest
          docker push $ECR_REPO:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REPO: ${{ secrets.ECR_REPO_URI }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # The orchestrator runs as a host Python process from /home/ec2-user/orchestrator/,
          # NOT inside a Docker container. The Docker image is only used to spawn user
          # sandbox containers (via MATRX_SANDBOX_IMAGE). So the deploy must:
          #   1. Free disk so pulls don't fail with "no space left on device" (Defense 1).
          #   2. Pull the latest sandbox + orchestrator images to ECR (sandbox image is consumed
          #      live; orchestrator image is for reference / future docker-based deploy).
          #   3. Replace the on-disk orchestrator code at /home/ec2-user/orchestrator/.
          #   4. Reinstall the editable Python package so importlib.metadata sees the new
          #      version and any new entry points / route registrations show up.
          #   5. Restart the systemd unit and health-check.
          PARAMS=$(jq -n --arg ecr "$ECR_REPO" --arg sha "$GITHUB_SHA" '{
            "commands": [
              "set -euo pipefail",
              "set -x",

              "echo === [1/5] Pre-pull disk cleanup ===",
              "df -h /",
              "sudo docker system prune -af --filter until=24h || true",
              "df -h /",

              "echo === [2/5] Pull latest images from ECR ===",
              ("aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin " + $ecr),
              ("sudo docker pull " + $ecr + ":latest"),
              ("sudo docker pull " + $ecr + ":slim"),
              ("sudo docker pull " + $ecr + "-orchestrator:latest"),
              ("sudo docker tag " + $ecr + ":latest matrx-sandbox:latest"),
              ("sudo docker tag " + $ecr + ":slim matrx-sandbox:slim"),
              ("sudo docker tag " + $ecr + "-orchestrator:latest matrx-orchestrator:latest"),

              "echo === [3/5] Update on-disk orchestrator code ===",
              ("sudo rm -rf /tmp/matrx-sandbox-deploy-" + $sha),
              ("sudo git clone --depth 1 --branch main https://github.com/armanisadeghi/matrx-sandbox.git /tmp/matrx-sandbox-deploy-" + $sha),
              "sudo find /home/ec2-user/orchestrator -mindepth 1 -maxdepth 1 ! -name \".*\" -exec rm -rf {} +",
              ("sudo cp -a /tmp/matrx-sandbox-deploy-" + $sha + "/orchestrator/. /home/ec2-user/orchestrator/"),
              "sudo chown -R ec2-user:ec2-user /home/ec2-user/orchestrator",
              ("sudo rm -rf /tmp/matrx-sandbox-deploy-" + $sha),
              "sudo grep -E \"^(version|name)\" /home/ec2-user/orchestrator/pyproject.toml",

              "echo === [4/5] Reinstall editable Python package ===",
              "sudo -u ec2-user bash -c \"cd /home/ec2-user/orchestrator && /usr/bin/python3.11 -m pip install --user --quiet -e .\"",

              "echo === [5/5] Restart and health-check ===",
              "sudo systemctl restart matrx-orchestrator",
              "echo Waiting for orchestrator to become healthy...",
              "HEALTHY=false; for i in $(seq 1 30); do if curl -sf -o /dev/null http://localhost:8000/health; then echo Orchestrator is healthy on attempt $i; HEALTHY=true; break; fi; sleep 2; done",
              "if [ \"$HEALTHY\" != \"true\" ]; then echo ERROR: Orchestrator did not become healthy; sudo journalctl -u matrx-orchestrator --no-pager -n 50; exit 1; fi",
              "echo === Deployed code version ===",
              "curl -sS http://localhost:8000/",
              "echo",
              "echo === Route count ===",
              "curl -sS http://localhost:8000/api-surface | python3 -c \"import sys,json; d=json.load(sys.stdin); print(\\\"routes=\\\",len(d.get(\\\"routes\\\",[])),\\\"tier=\\\",d.get(\\\"tier\\\"),\\\"version=\\\",d.get(\\\"version\\\"))\""
            ]
          }')

          echo "SSM Parameters: $PARAMS"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            || true

          # Get the command status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "SSM Command Status: $STATUS"

          # Get output for logging
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text

          # Check if the command succeeded
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi

          echo "Deploy completed successfully!"
