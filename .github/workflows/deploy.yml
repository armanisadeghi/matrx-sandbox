name: Deploy
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} (by {1})', github.workflow, inputs.requested_by || 'manual') || '' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      requested_by:
        description: "Agent session or lane that asked for this run (ci-spend attribution)"
        required: false
        default: ""
        type: string

env:
  AWS_REGION: us-east-1

# Never let an older main workflow finish after a newer one and move the
# approval ref backwards. Queue releases in commit arrival order.
concurrency:
  group: matrx-sandbox-main-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The release-hardening tests `git archive` pinned LEGACY commits
          # (LEGACY_EC2_SOURCE_SHAS) — a shallow checkout lacks them, which
          # failed every run since the promotion redesign landed and kept
          # deploy/hosted from ever being created (2026-07-22).
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.8"
          enable-cache: true
          cache-suffix: deploy
          cache-dependency-glob: |
            orchestrator/uv.lock
            sandbox-image/sdk/uv.lock
      - name: Install dependencies
        run: |
          uv sync --directory orchestrator --locked --extra dev --python 3.13
          uv sync --directory sandbox-image/sdk --locked --extra dev --python 3.11
      - name: Run orchestrator tests
        run: |
          cd orchestrator
          .venv/bin/pytest -v --tb=short
      - name: Run sandbox SDK tests
        run: sandbox-image/sdk/.venv/bin/pytest sandbox-image/sdk/tests -v --tb=short

  # The host poller follows the moving deploy/hosted pointer, never origin/main.
  # Every approved SHA also gets a SHA-qualified immutable approval ref so a
  # later unapproved main push cannot invalidate an in-flight rollout.
  approve-hosted:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Promote tested commit to hosted approval ref
        run: |
          set -euo pipefail
          # Ref names follow the checkout layout (scripts/lib/release-guard.sh):
          # deploy/hosted + deploy-approved/<sha> in this repository,
          # deploy/sandbox-hosted + sandbox/deploy-approved/<sha> in a monorepo.
          fail() { echo "$*" >&2; exit 1; }
          . scripts/lib/release-guard.sh
          release_source_init "$PWD"
          DEPLOY_REF="$MATRX_SANDBOX_DEPLOY_REF"
          git fetch origin refs/heads/main:refs/remotes/origin/main --quiet
          if [ -z "$MATRX_SANDBOX_SUBDIR" ]; then
            test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA" || {
              echo "Refusing to approve a historical workflow run; main has moved." >&2
              exit 1
            }
          else
            # Monorepo: main moves all day for unrelated paths. Refuse only when
            # the sandbox tree itself moved past the tested commit; that newer
            # commit has its own queued run (concurrency group above).
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main \
              || fail "Refusing: $GITHUB_SHA is not on main."
            test "$(git rev-parse "refs/remotes/origin/main:./")" = "$(git rev-parse "$GITHUB_SHA:./")" || {
              echo "Refusing to approve a historical workflow run; $MATRX_SANDBOX_SUBDIR moved on main." >&2
              exit 1
            }
          fi
          APPROVED=""
          if APPROVED=$(git ls-remote origin "$DEPLOY_REF" | cut -f1) \
              && test -n "$APPROVED"; then
            git cat-file -e "${APPROVED}^{commit}" 2>/dev/null \
              || git fetch origin "$APPROVED" --quiet
            git merge-base --is-ancestor "$APPROVED" "$GITHUB_SHA" || {
              echo "Refusing to move $DEPLOY_REF backwards or across history." >&2
              exit 1
            }
          fi
          APPROVAL_REF="${MATRX_SANDBOX_APPROVAL_PREFIX}$GITHUB_SHA"
          if EXISTING=$(git ls-remote origin "$APPROVAL_REF" | cut -f1) \
              && test -n "$EXISTING"; then
            test "$EXISTING" = "$GITHUB_SHA" || {
              echo "Immutable approval ref $APPROVAL_REF was moved." >&2
              exit 1
            }
          fi
          if [ -z "$MATRX_SANDBOX_SUBDIR" ]; then
            # Include main as a leased no-op update in the same atomic
            # transaction. If main changes after the check above in either
            # direction, the exact lease prevents every approval ref update.
            git push --atomic \
              --force-with-lease=refs/heads/main:$GITHUB_SHA origin \
              "${GITHUB_SHA}:refs/heads/main" \
              "${GITHUB_SHA}:${APPROVAL_REF}" \
              "${GITHUB_SHA}:${DEPLOY_REF}"
          else
            # Monorepo: never lease the shared main. Lease the deploy ref on the
            # value checked above (empty = must not exist yet), so it only moves
            # forward from exactly what this run proved it descends from.
            git push --atomic \
              "--force-with-lease=${DEPLOY_REF}:${APPROVED}" origin \
              "${GITHUB_SHA}:${APPROVAL_REF}" \
              "${GITHUB_SHA}:${DEPLOY_REF}"
          fi

  deploy:
    needs: [test, approve-hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Revalidate immutable approved release
        run: |
          set -euo pipefail
          fail() { echo "$*" >&2; exit 1; }
          . scripts/lib/release-guard.sh
          release_source_init "$PWD"
          APPROVAL_REF="${MATRX_SANDBOX_APPROVAL_PREFIX}$GITHUB_SHA"
          git fetch origin \
            "${APPROVAL_REF}:${APPROVAL_REF}" \
            "${MATRX_SANDBOX_DEPLOY_REF}:refs/remotes/origin/sandbox-deploy-ref" \
            --quiet
          test "$(git rev-parse "$APPROVAL_REF")" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/sandbox-deploy-ref)" = "$GITHUB_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push sandbox image
        run: |
          ECR_REPO=${{ secrets.ECR_REPO_URI }}
          ECR_NAME=${ECR_REPO#*/}
          # Stamp the zero-drift version (the commit SHA) so drift detection +
          # the migrate self-check work on ec2 images. See docs/ZERO_DRIFT.md.
          if aws ecr describe-images --repository-name "$ECR_NAME" \
              --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            docker pull "$ECR_REPO:${{ github.sha }}"
          else
            docker build --build-arg MATRX_IMAGE_VERSION=${{ github.sha }} \
              -t $ECR_REPO:${{ github.sha }} sandbox-image/
            docker push $ECR_REPO:${{ github.sha }}
          fi
          test "$(docker image inspect "$ECR_REPO:${{ github.sha }}" \
            --format '{{index .Config.Labels "com.aimatrx.sandbox.version"}}')" = "${{ github.sha }}"

      - name: Build and push lightweight (slim) sandbox image
        run: |
          # The "launch from chat" coding box — git-as-persistence, no
          # S3/FUSE/Chromium. Spawned when template=slim resolves to
          # matrx-sandbox:slim. See docs/EC2_LIGHTWEIGHT_BOX.md.
          ECR_REPO=${{ secrets.ECR_REPO_URI }}
          ECR_NAME=${ECR_REPO#*/}
          if aws ecr describe-images --repository-name "$ECR_NAME" \
              --image-ids imageTag=slim-${{ github.sha }} >/dev/null 2>&1; then
            docker pull "$ECR_REPO:slim-${{ github.sha }}"
          else
            docker build -f sandbox-image/Dockerfile.slim \
              --build-arg MATRX_IMAGE_VERSION=${{ github.sha }} \
              -t $ECR_REPO:slim-${{ github.sha }} sandbox-image/
            docker push $ECR_REPO:slim-${{ github.sha }}
          fi
          test "$(docker image inspect "$ECR_REPO:slim-${{ github.sha }}" \
            --format '{{index .Config.Labels "com.aimatrx.sandbox.version"}}')" = "${{ github.sha }}"

      - name: Build and push internal development sandbox image
        run: |
          # Internal-only derivative of slim with the current AI Matrx repo
          # toolchains. It is exposed only on the allowlisted EC2 host.
          ECR_REPO=${{ secrets.ECR_REPO_URI }}
          ECR_NAME=${ECR_REPO#*/}
          if aws ecr describe-images --repository-name "$ECR_NAME" \
              --image-ids imageTag=development-${{ github.sha }} >/dev/null 2>&1; then
            docker pull "$ECR_REPO:development-${{ github.sha }}"
          else
            docker build -f sandbox-image/Dockerfile.development \
              --build-arg BASE_IMAGE="$ECR_REPO:slim-${{ github.sha }}" \
              --build-arg MATRX_IMAGE_VERSION=${{ github.sha }} \
              -t "$ECR_REPO:development-${{ github.sha }}" sandbox-image/
            docker push "$ECR_REPO:development-${{ github.sha }}"
          fi
          test "$(docker image inspect "$ECR_REPO:development-${{ github.sha }}" \
            --format '{{index .Config.Labels "com.aimatrx.sandbox.version"}}')" = "${{ github.sha }}"

      - name: Build and push orchestrator image
        run: |
          ECR_REPO=${{ secrets.ECR_REPO_URI }}-orchestrator
          ECR_NAME=${ECR_REPO#*/}
          if aws ecr describe-images --repository-name "$ECR_NAME" \
              --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            docker pull "$ECR_REPO:${{ github.sha }}"
          else
            docker build --build-arg MATRX_SOURCE_SHA=${{ github.sha }} \
              -t $ECR_REPO:${{ github.sha }} orchestrator/
            docker push $ECR_REPO:${{ github.sha }}
          fi
          test "$(docker image inspect "$ECR_REPO:${{ github.sha }}" \
            --format '{{index .Config.Labels "com.aimatrx.source.sha"}}')" = "${{ github.sha }}"

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REPO: ${{ secrets.ECR_REPO_URI }}
          GITHUB_SHA: ${{ github.sha }}
          # This job's own token (contents: read, dies when the job ends) is the
          # EC2 host's ONLY GitHub credential: no stored key, nothing to rotate,
          # and it reads this repository whether it is public, private, or the
          # aidream monorepo. git gets it via GIT_CONFIG_* env (git >= 2.31),
          # scoped to this one repository URL, never written to disk.
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch and execute only the tested commit. deploy-ec2.sh stages its
          # locked venv and immutable image tags, migrates, swaps, verifies the
          # exact release contract, and rolls the whole release back on error.
          fail() { echo "$*" >&2; exit 1; }
          . scripts/lib/release-guard.sh
          release_source_init "$PWD"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          APPROVAL_REF="${MATRX_SANDBOX_APPROVAL_PREFIX}${GITHUB_SHA}"
          AUTH_B64=$(printf 'x-access-token:%s' "$GIT_AUTH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH_B64"
          # Blobless + (in a monorepo) sparse: the host downloads the commit
          # graph and only the sandbox's own files, never the whole monorepo.
          PARAMS=$(jq -n --arg ecr "$ECR_REPO" --arg sha "$GITHUB_SHA" \
            --arg url "$REPO_URL" --arg auth "$AUTH_B64" --arg ref "$APPROVAL_REF" \
            --arg sub "$MATRX_SANDBOX_SUBDIR" '
            ("/tmp/matrx-sandbox-deploy-" + $sha) as $d
            | ($d + (if $sub == "" then "" else "/" + $sub end)) as $root
            | "sudo --preserve-env=GIT_CONFIG_COUNT,GIT_CONFIG_KEY_0,GIT_CONFIG_VALUE_0,GIT_TERMINAL_PROMPT" as $su
            | {
            "commands": [
              "set -euo pipefail",
              ("export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http." + $url + ".extraheader GIT_CONFIG_VALUE_0=\"AUTHORIZATION: basic " + $auth + "\" GIT_TERMINAL_PROMPT=0"),
              "set -x",
              "df -h /",
              # `-a` removes only images unused by containers. It is required
              # here because immutable release tags are not dangling, while
              # retained Docker volumes must never be pruned as deployment GC.
              "sudo docker image prune -a -f || true",
              ("aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin " + $ecr),
              ("sudo rm -rf " + $d),
              ("sudo git init -q " + $d),
              ("sudo git -C " + $d + " remote add origin " + $url),
              ("sudo git -C " + $d + " config remote.origin.promisor true"),
              ("sudo git -C " + $d + " config remote.origin.partialclonefilter blob:none"),
              (if $sub == "" then empty else ("sudo git -C " + $d + " sparse-checkout set --cone " + $sub) end),
              ($su + " git -C " + $d + " fetch --filter=blob:none origin " + $ref),
              ("test $(sudo git -C " + $d + " rev-parse FETCH_HEAD) = " + $sha),
              ($su + " git -C " + $d + " checkout --detach " + $sha),
              ("test $(sudo git -C " + $d + " rev-parse HEAD) = " + $sha),
              ($su + " bash " + $root + "/scripts/deploy-ec2.sh " + $sha + " " + $ecr + " " + $root),
              ("sudo rm -rf " + $d)
            ]
          }')

          echo "SSM Parameters: ${PARAMS//$AUTH_B64/***}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --timeout-seconds 1200 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to finish. The built-in `aws ssm wait
          # command-executed` gives up after ~20 polls (~100s) — too short for a
          # git clone + pip install + 60s health loop on a busy box, which left
          # STATUS=InProgress and failed a deploy that was actually still
          # working. Poll manually up to the command's own 1200s timeout instead.
          STATUS="Pending"
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "SSM Command Status: $STATUS"

          # Get output for logging
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text

          # Check if the command succeeded
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi

          echo "Deploy completed successfully!"

  # ── Hosted tier (/srv host) ────────────────────────────────────────────────
  # The `deploy` job above ships the EC2 tier (ECR + SSM). This job ships the
  # HOSTED tier that runs on the /srv dev host — the matrx-orchestrator
  # container + the matrx-sandbox:{core,slim,aidream} images that the hosted
  # orchestrator spawns. Previously hand-built (the source of repeated drift:
  # stale hosted orchestrator, missing aidream image). Now auto-deployed on
  # every push to main, health-gated with rollback (see scripts/deploy-hosted.sh).
  #
  # Reuses the SAME SSH secrets matrx-ship's pipeline already uses to reach /srv
  # (DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PORT). If those are
  # org-level secrets they're already available here; otherwise add them to this
  # repo once. Runs after `deploy` but does NOT depend on it succeeding — the
  # hosted tier should update even if an EC2/ECR step had a transient failure.
  # BEST-EFFORT fast path only. SSH from GitHub runners to this host times out
  # intermittently (runner IPs share Azure ranges that trip the host's
  # fail2ban), which used to make this job fail ~half the time and, worse, made
  # a red X here read as "the deploy is broken". The AUTHORITATIVE deploy is
  # now the pull-based poller ON the host (scripts/systemd/ — a 2-min timer
  # running deploy-hosted.sh), which needs no inbound connectivity at all.
  # This job just makes a lucky run deploy a couple of minutes sooner.
  # continue-on-error keeps a timeout from failing the whole workflow.
  deploy-hosted:
    name: Deploy hosted tier (/srv) — best-effort; host poller is authoritative
    needs: [test, approve-hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Rebuild + redeploy hosted orchestrator & images via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 60s
          # This fast path shares the host's serialized deploy lock with the
          # authoritative poller. Budget for one queued recovery plus one cold
          # core/slim/aidream build instead of reporting a false failed job.
          command_timeout: 120m
          script: |
            set -e
            # Serialize with the host poller BEFORE touching the checkout —
            # a bare `git reset` here could clobber a poller build mid-flight.
            # We hold the main lock for the whole sync+deploy section; the
            # inner deploy-hosted.sh is pointed at a separate lock file
            # (flock isn't reentrant across processes, and holding the main
            # lock is exactly the point).
            # The installed poller runner IS the sync path: it reads the host's
            # source config (/etc/matrx/sandbox-release.env: checkout, subdir,
            # ref), takes the main lock, and refuses unless the approved ref is
            # exactly this run's commit. One path, so the two can never drift.
            MATRX_SANDBOX_EXPECT_SHA='${{ github.sha }}' \
              /usr/local/bin/matrx-hosted-deploy-runner
