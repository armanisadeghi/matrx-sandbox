[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrx-orchestrator"
version = "0.1.2"
description = "Matrx sandbox orchestrator — manages ephemeral AI sandbox lifecycle"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "docker>=7.0",
    "boto3>=1.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-json-logger>=3.0",
    "asyncpg>=0.29",
    "cryptography>=42.0",
    # Runtime, not dev: routes/sandboxes.py + sandbox_manager.py import httpx at
    # module import time (the reverse proxies + user-secrets fetch). Keeping it
    # in [dev] forced the production image to install ".[dev]" just to boot.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "moto[s3]"]

[tool.setuptools.packages.find]
include = ["orchestrator*"]
